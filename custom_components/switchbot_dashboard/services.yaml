send_text:
  name: Send Text
  description: Sends custom text to the SwitchBot Weather Station.
  fields:
    text:
      name: Text
      description: Text to display
      required: true
      example: "Hallo Welt"

refresh:
  name: Refresh Dashboard
  description: Renders the dashboard and sends it right away, bypassing the rate limit.

preview:
  name: Preview Dashboard
  description: Renders the dashboard once and sends it, independent of the automatic refresh.

reload:
  name: Reload Configuration
  description: >-
    Reads the switchbot_dashboard block of configuration.yaml again and
    applies it without restarting Home Assistant. An invalid
    configuration is reported in the log and the running one is kept.
