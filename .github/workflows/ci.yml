name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          set -e
          for test in custom_components/switchbot_dashboard/tests/test_*.py; do
            echo "== $test"
            python3 "$test"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.17.6"

      # Only critical errors (syntax, undefined names) block
      - name: Ruff (critical)
        run: ruff check custom_components --select E9,F63,F7,F82

  hacs:
    runs-on: ubuntu-latest
    # hacs/action can only validate public repositories
    if: ${{ !github.event.repository.private }}
    # Non-blocking: hacs/action currently reports errors even for
    # valid files (hacs/integration#5252); brands needs a separate
    # PR in the home-assistant/brands repository
    continue-on-error: true
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: HACS validation
        # hacs/action has no current release; main pinned to commit
        # as of 2026-11-21 (Dependabot proposes updates)
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands
